services:
  chatbot:
    build: ./chatbot
    container_name: sales-chatbot
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; import sys; sys.stdout.write(urllib.request.urlopen('http://localhost:8000/health').read().decode())"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme}"
      POSTGRES_DB: appdb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app -d appdb
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: nginx:alpine
    container_name: app-web
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost/
      interval: 30s
      timeout: 5s
      retries: 3
